<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Combat</title>
    <link rel="stylesheet" href="combat.css" />

    <script src="monster.js" defer></script>
    <script src="player.js" defer></script>
    <script src="weapon.js" defer></script>
    <script src="combat.js" defer></script>
    <script src="/Navigation/navigation.js" defer></script>
  </head>

  <body>
    <main>
      <p id="goblinHP"></p>
      <p id="playerHP"></p>
      <img
        class="goblinPic"
        id="goblinImage"
        src="/Pictures/goblin.png"
        alt="Hemogoblin"
        onclick="attack()"
      />

      <p id="status-text">Click the goblin to kill that mf.</p>
      <p>Konsoliin tulee ilmoitus damagesta</p>

      <!-- Tämä sitten kun pelaaja on päihittänyt goblinin -->
      <button
        class="button"
        id="continue-btn"
        onclick="nextRoom()"
        style="display: none"
      >
        Continue
      </button>

      <!-- Tämä jos pelaaja kuolee -->
      <button
        class="button"
        id="menu-btn"
        onclick="menu()"
        style="display: none"
      >
        Back to main menu
      </button>
    </main>
  </body>
</html>
